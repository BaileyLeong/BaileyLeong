name: Habits Preview
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: BaileyLeong
          template: classic
          base: ""
          filename: habits-preview.svg
          output_action: none
          config_timezone: America/Toronto
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: no
          plugin_habits_from: 100
          plugin_habits_days: 14
          plugin_habits_skipped: BaileyLeong
      - uses: actions/upload-artifact@v4
        with:
          name: habits-preview
          path: /metrics_renders/habits-preview.svg
