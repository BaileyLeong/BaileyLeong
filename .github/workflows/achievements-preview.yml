name: Achievements Preview
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: BaileyLeong
          template: classic
          base: ""
          filename: achievements-detailed.svg
          output_action: none
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_threshold: C
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: BaileyLeong
          template: classic
          base: ""
          filename: achievements-compact.svg
          output_action: none
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
      - uses: actions/upload-artifact@v4
        with:
          name: achievements-preview
          path: /metrics_renders/achievements-*.svg
